[package]
name = "eddn"
description = "Elite: Dangerous Data Network (EDDN) subscriber"
version = "0.2.0"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
license = "Beerware"
edition = "2018"

[dependencies]
elite_journal = "0.3"
serde = "1.0"
serde_json = "1.0"
